<!DOCTYPE html>
<html lang="en" data-theme="__THEME__">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>pi — sessions</title>
        <style>
        :root[data-theme="light"] {
            color-scheme: light;
            --bg: #f8f8f8;
            --card: #ffffff;
            --border: #e0e0e0;
            --text: #1f2328;
            --muted: #6e7681;
            --dim: #8a8f98;
            --accent: #4a4af0;
        }
        :root[data-theme="dark"] {
            color-scheme: dark;
            --bg: #16161a;
            --card: #1e1e24;
            --border: #2a2a30;
            --text: #e5e5e7;
            --muted: #9a9aa2;
            --dim: #666;
            --accent: #5a5af0;
        }
        body {
            font:
                15px / 1.5 system-ui,
                sans-serif;
            max-width: 800px;
            margin: 3rem auto;
            padding: 0 1rem;
            background: var(--bg);
            color: var(--text);
        }
        h1 {
            font-size: 1.3rem;
            display: inline-block;
        }
        #toggle {
            float: right;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text);
            border-radius: 6px;
            padding: 0.25rem 0.6rem;
            cursor: pointer;
            font-size: 0.85rem;
        }
        #toggle:hover {
            border-color: var(--accent);
        }
        input {
            width: 100%;
            padding: 0.6rem 0.8rem;
            font-size: 1rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text);
            box-sizing: border-box;
        }
        #count {
            color: var(--muted);
            margin: 0.6rem 0;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        a {
            display: block;
            padding: 0.7rem 0.9rem;
            margin: 0.3rem 0;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text);
            text-decoration: none;
        }
        a:hover {
            border-color: var(--accent);
        }
        .project {
            color: var(--muted);
            font-size: 0.85rem;
        }
        .date {
            color: var(--dim);
            font-size: 0.8rem;
            float: right;
        }
        </style>
    </head>
    <body>
        <h1>Pi Sessions Browser</h1>
        <button id="toggle" aria-label="Toggle theme"></button>
        <input id="q" placeholder="Search sessions (fuzzy)..." autofocus>
        <div id="count"></div>
        <ul id="list"></ul>
        <script>
        const DATA = __DATA__;
        const root = document.documentElement;
        const toggle = document.getElementById("toggle");

        const saved = localStorage.getItem("pi-sb-theme");
        if (saved) root.dataset.theme = saved;
        function themeIcon() {
            return root.dataset.theme === "light"
                ? "\u{1F319}"
                : "\u{2600}\u{FE0F}";
        }
        toggle.textContent = themeIcon();
        toggle.addEventListener("click", () => {
            root.dataset.theme =
                root.dataset.theme === "light" ? "dark" : "light";
            localStorage.setItem("pi-sb-theme", root.dataset.theme);
            toggle.textContent = themeIcon();
        });

        const qEl = document.getElementById("q");
        const list = document.getElementById("list");
        const count = document.getElementById("count");

        // Subsequence fuzzy score: consecutive matches worth more. -1 = no match.
        function score(q, s) {
            q = q.toLowerCase();
            s = s.toLowerCase();
            let qi = 0,
                points = 0,
                last = -1,
                run = 0;
            for (let i = 0; i < s.length && qi < q.length; i++) {
                if (s[i] === q[qi]) {
                    points += i === last + 1 ? 3 + run++ : 1;
                    last = i;
                    qi++;
                }
            }
            return qi === q.length ? points : -1;
        }

        function prettyDate(d) {
            return d.replace("T", " ").slice(0, 16);
        }

        function render() {
            const q = qEl.value.trim();
            const items = DATA.map((s) => ({
                s,
                sc: score(q, s.name + " " + s.project + " " + s.date),
            }))
                .filter((i) => i.sc >= 0)
                .sort((a, b) => b.sc - a.sc || (a.s.date < b.s.date ? 1 : -1));
            count.textContent = items.length + " / " + DATA.length;
            list.replaceChildren(
                ...items.map(({ s }) => {
                    const a = document.createElement("a");
                    a.href = s.file;
                    const title = document.createElement("div");
                    title.textContent = s.name || prettyDate(s.date);
                    const meta = document.createElement("div");
                    const project = document.createElement("span");
                    project.className = "project";
                    project.textContent = s.project;
                    const date = document.createElement("span");
                    date.className = "date";
                    date.textContent = prettyDate(s.date);
                    meta.append(project, date);
                    a.append(title, meta);
                    return a;
                }),
            );
        }
        qEl.addEventListener("input", render);
        render();
        </script>
    </body>
</html>
