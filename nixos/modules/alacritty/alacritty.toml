[env]
TERM = "xterm-256color"
[general]
import = ["~/.config/alacritty/themes/catppuccin_latte.toml"]
[window]
padding.x = 180
padding.y = 90
startup_mode = "Maximized"
# opacity = 0.8
[scrolling]
history = 10_000
[font]
normal = { style = "Regular", family = "JetBrainsMono Nerd Font" }
size = 16

[[keyboard.bindings]]
key = "Enter"
mods = "Alt"
chars = "\u001b[13;3u"

[[keyboard.bindings]]
key = "Enter"
mods = "Shift"
chars = "\u001b[13;2u"
