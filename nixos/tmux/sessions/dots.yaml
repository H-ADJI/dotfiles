session_name: Dotfiles
suppress_history: true
start_directory: ~/PDE/
windows:
  - window_name: "editor"
    shell_command_before: devenv shell -- nvim
    focus: true

  - window_name: "shell-prompt"
    shell_command_before: devenv shell 

  - window_name: "coding-agent"
    shell_command_before: devenv shell -- pi
