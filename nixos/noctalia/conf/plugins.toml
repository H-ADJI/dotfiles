[plugins]
enabled = [
  "jamesfeeder/special-workspaces",
  "k4n4t4/hypr-submap",
  "thepunkoff/pomodoro",
]
auto_update = false


[plugin_settings."thepunkoff/pomodoro"]
work-duration = 40
short-break-duration = 1
long-break-duration = 20
sessions-before-long-break = 2
auto-start-work = false
auto-start-breaks = false
panel_open_near_click = false
panel_placement = "floating"
panel_position = "center"
use-bundled-alarm-sound = true
bypass-noctalia-sound-globals = true


[notification.filter.pomodoro]
match = "noctalia"
match_content = "Pomodoro Timer"
play_sound = false
