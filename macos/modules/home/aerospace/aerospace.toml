start-at-login = true

[keys]
# Focus direction
cmd-h = "focus left"
cmd-j = "focus down"
cmd-k = "focus up"
cmd-l = "focus right"
cmd-left = "focus left"
cmd-down = "focus down"
cmd-up = "focus up"
cmd-right = "focus right"

# Move window
"cmd-shift-h" = "move left"
"cmd-shift-j" = "move down"
"cmd-shift-k" = "move up"
"cmd-shift-l" = "move right"

# Workspaces
cmd-1 = "workspace 1"
cmd-2 = "workspace 2"
cmd-3 = "workspace 3"
cmd-4 = "workspace 4"
cmd-5 = "workspace 5"
cmd-6 = "workspace 6"
cmd-7 = "workspace 7"
cmd-8 = "workspace 8"
cmd-9 = "workspace 9"
cmd-0 = "workspace 10"

# Move window to workspace
"cmd-shift-1" = "move-node-to-workspace 1"
"cmd-shift-2" = "move-node-to-workspace 2"
"cmd-shift-3" = "move-node-to-workspace 3"
"cmd-shift-4" = "move-node-to-workspace 4"
"cmd-shift-5" = "move-node-to-workspace 5"
"cmd-shift-6" = "move-node-to-workspace 6"
"cmd-shift-7" = "move-node-to-workspace 7"
"cmd-shift-8" = "move-node-to-workspace 8"
"cmd-shift-9" = "move-node-to-workspace 9"
"cmd-shift-0" = "move-node-to-workspace 10"

# Actions
cmd-q = "close"
cmd-f = "fullscreen"

# Launch
"cmd-space" = 'launch --dont-close-when-launched "Ghostty"'
cmd-b = 'launch --dont-close-when-launched "Google Chrome"'
cmd-d = 'exec-and-forget open -b com.apple.Spotlight'
