#! /bin/env bash
# Disable escape-time delay for vim mode switching
set -g escape-time 0
# Enable aggressive resize for multi-monitor grouped sessions
set -g aggressive-resize on
set -g prefix C-a
set -ag terminal-overrides ",xterm-256color:RGB"
set -g detach-on-destroy on
set -g renumber-windows on
set -g set-clipboard on
